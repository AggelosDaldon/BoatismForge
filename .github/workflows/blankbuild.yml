
name: Build Boatism Forge

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find Gradle project
        run: |
          find . -name "build.gradle" -o -name "settings.gradle"

      - name: Build Forge Mod
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Boatism-Forge-1.20.1
          path: '**/build/libs/*.jar'
          if-no-files-found: error
