name: Build Boatism Forge
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $GITHUB_WORKSPACE"
          find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            project_dir="."
          else
            mapfile -t matches < <(find . -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one Gradle project, found ${#matches[@]}. Upload project files with settings.gradle at repository root."
              exit 1
            fi
            project_dir="$(dirname "${matches[0]}")"
          fi
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Building in $project_dir"
      - name: Build Forge mod
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/boatism-build.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatism-build-log
          path: boatism-build.log
          if-no-files-found: warn
      - name: Upload compiled jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boatism-forge-jars
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
